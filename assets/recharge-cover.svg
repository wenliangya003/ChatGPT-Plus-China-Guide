  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102B2B"/>
      <stop offset="1" stop-color="#101B21"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#23413E"/>
      <stop offset="1" stop-color="#172C30"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#background)"/>
  <g fill="none" stroke="#A7F3D0" stroke-opacity=".1">
